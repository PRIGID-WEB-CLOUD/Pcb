kind = "web"
previewPath = "/"
title = "LUXE BOUTIQUE"
version = "1.0.0"
id = "artifacts/luxe-boutique"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22805

[services.development]
run = "pnpm --filter @workspace/luxe-boutique run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/luxe-boutique", "run", "build" ]
publicDir = "artifacts/luxe-boutique/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22805"
BASE_PATH = "/"
